[project]
name = "cider"
version = "0.1.0"
description = "Poverty prediction and location inference with mobile phone call data records"
authors = [
    { name = "Emily Aiken" },
    { name = "Lucio Melito" },
    { name = "Andrew Vaziri" }
]
readme = "README.md"
requires-python = ">=3.10,<=3.11"
dependencies = [
    "bandicoot>=0.6.0",
    "deepdiff>=8.6.1",
    "fonttools==4.60.2",
    "geopandas>=1.0.1",
    "geovoronoi>=0.4.0",
    "importlib-resources>=6.5.2",
    "pandas==2.1.4",
    "pillow==12.1.1",
    "pydantic>=2.12.3",
    "pyspark==3.5.8",
    "pytest-mock>=3.15.1",
    "pytest-randomly>=4.0.1",
    "python-box>=7.3.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.4.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "types-geopandas>=1.1.1.20250829",
    "types-pyyaml>=6.0.12.20250915",
    "urllib3==2.6.3",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "interrogate>=1.7.0",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.14.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["cider"]

[tool.mypy]
ignore_missing_imports = true
